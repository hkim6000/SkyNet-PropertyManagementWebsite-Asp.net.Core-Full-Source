<div class="ct-site" data-page="Contact">
{plhd_head}
<main class="ct-main" id="ct-main">{plhd_main}</main>
{plhd_foot}
<div class="ct-pop" id="ct-pop" aria-hidden="true">
    <div class="ct-popbox" role="dialog" aria-modal="true" aria-labelledby="ct-pop-t" aria-describedby="ct-pop-m">
        <div class="ct-popic" aria-hidden="true"><svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
        <h2 id="ct-pop-t"></h2>
        <div class="ct-popmsg" id="ct-pop-m"></div>
        <button type="button" class="ct-btn ct-wide" id="ct-pop-ok" onclick="ContactJs.popClose()">OK</button>
    </div>
</div>
<div class="ct-toast" id="ct-toast" role="status" aria-live="polite"></div>
</div>
