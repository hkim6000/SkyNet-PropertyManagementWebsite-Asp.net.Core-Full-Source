<div class="pr-site" data-page="AdminProperties" id="pr-site-root">
<header class="pr-top">
    <button type="button" class="pr-burger" aria-label="Menu" onclick="AdminPropertiesJs.openMenu()"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    <a class="pr-logo" href="Admin"><svg viewBox="0 0 40 40" width="30" height="30" aria-hidden="true"><rect width="40" height="40" rx="9" fill="#17322A"/><path d="M9 20.5L20 11l11 9.5" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M13 18.5V30h14V18.5" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linejoin="round"/><path d="M20 21.5l2.6 2.6L20 28l-2.6-3.9z" fill="#B4472B"/></svg><span id="pr-brand">Staff</span><small>Staff</small></a>
    <div class="pr-who" id="pr-who"></div>
    <a class="pr-tl pr-tlv" href="Home" target="_blank" rel="noopener">View site</a>
    <button type="button" class="pr-tl" onclick="AdminPropertiesJs.signout()">Sign out</button>
</header>
<div class="pr-body">
    <nav class="pr-rail" id="pr-rail" aria-label="Staff menu">
        <div class="pr-rail-top"><b>Menu</b><button type="button" class="pr-ibtn" aria-label="Close menu" onclick="AdminPropertiesJs.closeMenu()"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
        <div class="pr-menu" id="pr-menu"></div>
    </nav>
    <div class="pr-scrim" id="pr-scrim" onclick="AdminPropertiesJs.closeMenu()"></div>
    <main class="pr-main" id="pr-main"><div class="pr-loading">Loading</div></main>
</div>
<div class="pr-modal" id="pr-modal" aria-hidden="true">
    <div class="pr-mbox" role="dialog" aria-modal="true" aria-labelledby="pr-mtitle">
        <div class="pr-mhead"><h2 id="pr-mtitle"></h2><button type="button" class="pr-ibtn" aria-label="Close" onclick="AdminPropertiesJs.closeModal()"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
        <div class="pr-mbody" id="pr-mbody"></div>
    </div>
</div>
<div class="pr-pk" id="pr-pk" aria-hidden="true">
    <div class="pr-mbox pr-pkbox" role="dialog" aria-modal="true" aria-labelledby="pr-pkt">
        <div class="pr-mhead"><h2 id="pr-pkt">Choose from the media library</h2><button type="button" class="pr-ibtn" aria-label="Close" onclick="AdminPropertiesJs.pkClose()"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
        <div class="pr-mbody">
            <div class="pr-pkbar"><input type="search" id="pr-pkq" placeholder="Search by name or description" maxlength="40" oninput="AdminPropertiesJs.pkSearch()" aria-label="Search media"><label class="pr-btn pr-btn-ghost pr-btn-sm pr-upbtn"><input type="file" id="pr-pkfile" accept="image/jpeg,image/png,image/webp,image/gif" onchange="AdminPropertiesJs.pkUpload()">Upload new</label></div>
            <div class="pr-chips pr-pkkinds" id="pr-pkkinds" hidden><button type="button" class="pr-chip pr-act" data-pk="all" aria-pressed="true" onclick="AdminPropertiesJs.pkKindSet('all')">All</button><button type="button" class="pr-chip" data-pk="photo" aria-pressed="false" onclick="AdminPropertiesJs.pkKindSet('photo')">Photos</button><button type="button" class="pr-chip" data-pk="video" aria-pressed="false" onclick="AdminPropertiesJs.pkKindSet('video')">Videos</button></div>
            <p class="pr-upmsg" id="pr-pkmsg" role="status"></p>
            <div class="pr-pkgrid" id="pr-pkgrid"></div>
        </div>
    </div>
</div>
<div class="pr-toast" id="pr-toast" role="status" aria-live="polite"></div>
</div>
